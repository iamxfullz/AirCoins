# AirCoins - lighttpd configuration
# Lightweight web server for serving the portal
# Install to: /etc/lighttpd/lighttpd.conf

# Server root - where the HTML files live
server.document-root = "/var/www/html"

# Listen on port 80
server.port = 80

# Bind to ALL interfaces - server is reachable on the LAN
server.bind = "0.0.0.0"

# Server tag (hidden for security)
server.tag = "AirCoins"

# Username for the server process
server.username = "www-data"
server.groupname = "www-data"

# PID file
server.pid-file = "/var/run/lighttpd.pid"

# Error log
server.errorlog = "/var/log/lighttpd/error.log"

# Access log
accesslog.filename = "/var/log/lighttpd/access.log"

# MIME types
mimetype.assign = (
    ".html" => "text/html",
    ".htm"  => "text/html",
    ".css"  => "text/css",
    ".js"   => "application/javascript",
    ".json" => "application/json",
    ".png"  => "image/png",
    ".jpg"  => "image/jpeg",
    ".jpeg" => "image/jpeg",
    ".webp" => "image/webp",
    ".gif"  => "image/gif",
    ".svg"  => "image/svg+xml",
    ".ico"  => "image/x-icon",
    ".txt"  => "text/plain",
    ".xml"  => "application/xml",
    ".woff" => "font/woff",
    ".woff2" => "font/woff2"
)

# Default index file
index-file.names = ( "index.html" )

# Error pages
# Any other hijacked URL (DNS points every host here) falls through to the
# portal page, so unknown probe paths still show the portal.
#
# CAUTION: this also turns a wrong /api/... path into HTTP 200 + portal
# HTML, which makes a broken portal poll look like a successful request.
# The portal therefore rejects non-JSON answers explicitly (fetchJSON).
server.error-handler-404 = "/index.html"

# Directory listing (disabled for security)
dir-listing.encoding = "utf-8"
server.dir-listing = "disable"

# Compression (optional - saves bandwidth)
# server.modules += ( "mod_compress" )
# compress.cache-dir = "/var/cache/lighttpd/compress/"
# compress.filetype = ( "text/html", "text/css", "application/javascript" )

# Modules to load
# NOTE: mod_rewrite must be loaded before mod_redirect.
server.modules = (
    "mod_access",
    "mod_accesslog",
    "mod_rewrite",
    "mod_redirect",
    "mod_alias",
    "mod_cgi",
    "mod_proxy"
)

# ============================================
# CAPTIVE PORTAL DETECTION
# ============================================
# Per-VLAN dnsmasq resolves every hostname to the gateway, so the OS
# connectivity probes land here. Answering them with a 302 to the portal
# instead of the expected response is what triggers the auto-popup:
#
#   iOS/macOS  captive.apple.com/hotspot-detect.html  expects "Success" body
#              -> gets 302, shows the Captive Network Assistant
#   Android 5+ clients3.google.com/generate_204       expects HTTP 204
#   Android    connectivitycheck.gstatic.com/generate_204, /gen_204
#   Samsung    connectivitycheck.samsung.com/generate_204
#              -> gets 302, shows the "Sign in to network" notification
#   Windows    www.msftconnecttest.com/connecttest.txt expects "Microsoft Connect Test"
#              -> gets 302, NCSI flags the network as a portal
#
# The host is captured and reused so the redirect is an absolute URL for
# whichever probe domain was requested (old Android clients handle these
# more reliably than relative Location headers). Because DNS points every
# name at the gateway, that URL still resolves back to this server.
#
# Probe paths below, in order: Apple (x2), Android/Samsung (x4),
# Windows NCSI (x2), Firefox/NetworkManager/Ubuntu (x4), Kindle (x1).
$HTTP["host"] =~ "^(.+)$" {
    url.redirect-code = 302
    url.redirect = (
        "^/hotspot-detect\.html(\?.*)?$"       => "http://%1/index.html",
        "^/library/test/success\.html(\?.*)?$" => "http://%1/index.html",
        "^/generate_204(\?.*)?$"               => "http://%1/index.html",
        "^/gen_204(\?.*)?$"                    => "http://%1/index.html",
        "^/generate204(\?.*)?$"                => "http://%1/index.html",
        "^/mobile/status\.php(\?.*)?$"         => "http://%1/index.html",
        "^/connecttest\.txt(\?.*)?$"           => "http://%1/index.html",
        "^/ncsi\.txt(\?.*)?$"                  => "http://%1/index.html",
        "^/success\.txt(\?.*)?$"               => "http://%1/index.html",
        "^/canonical\.html(\?.*)?$"            => "http://%1/index.html",
        "^/nm-check\.txt(\?.*)?$"              => "http://%1/index.html",
        "^/check_network_status\.txt(\?.*)?$"  => "http://%1/index.html",
        "^/kindle-wifi/wifistub\.html(\?.*)?$" => "http://%1/index.html"
    )
}

# Reverse proxy: forward /api/* to Go backend
# proxy.forwarded makes lighttpd set X-Forwarded-For (and friends) on the
# proxied request — the Go API identifies the paying client by that header
# (clientIPFromRequest) since RemoteAddr is always 127.0.0.1 behind this
# proxy. Requires lighttpd >= 1.4.56 (Debian Bullseye ships 1.4.59,
# Bookworm 1.4.69 — both fine). Verify on the device with:  lighttpd -v
$HTTP["url"] =~ "^/api/" {
    proxy.server = ( "" => (( "host" => "127.0.0.1", "port" => 8080 )) )
    proxy.forwarded = ( "for" => 1 )
}

# Reverse proxy: forward /audio/* to Go backend.
# Uploaded portal audio clips (insertcoin, coindrop, donepaying) are served
# by the Go AudioHandler, not from the lighttpd docroot. Without this rule
# the request falls through to error-handler-404 → index.html (HTML, not
# audio), so <audio> elements and new Audio() both fail silently.
$HTTP["url"] =~ "^/audio/" {
    proxy.server = ( "" => (( "host" => "127.0.0.1", "port" => 8080 )) )
    proxy.forwarded = ( "for" => 1 )
}

# CGI configuration for admin API
# The scripts are installed to /usr/lib/cgi-bin (NOT under server.document-root),
# so /cgi-bin/ MUST be aliased to that physical directory before mod_cgi can run
# them. Without this, a /cgi-bin/... request 404s and error-handler-404 serves
# index.html (HTTP 200) — which silently breaks every admin CGI (GPIO toggle,
# GPIO pin test, etc.) while the UI appears to work.
$HTTP["url"] =~ "^/cgi-bin/" {
    alias.url += ( "/cgi-bin/" => "/usr/lib/cgi-bin/" )
    cgi.assign = ( "" => "/bin/bash" )
}

# Max connections
server.max-connections = 128

# File descriptor cache
server.max-fds = 256

# Network settings
server.network-backend = "writev"
server.max-read-idle = 60
server.max-write-idle = 60
server.max-keep-alive-idle = 30
server.max-keep-alive-requests = 16

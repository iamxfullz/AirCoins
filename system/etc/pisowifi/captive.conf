# ============================================
# AirCoins - Captive Portal Configuration
# ============================================
# Install to: /etc/pisowifi/captive.conf
#
# Sourced by aircoins-captive-rules.
# Values set here override the built-in defaults.
# ============================================

# Upstream resolver for authorized (paying) clients.
# Their port 53 traffic is DNAT'ed here so they get real DNS
# instead of the wildcard portal answers from the local dnsmasq.
UPSTREAM_DNS=8.8.8.8

# Internet uplink interface used for MASQUERADE.
# Leave empty to auto-detect from the default route.
WAN_IFACE=
